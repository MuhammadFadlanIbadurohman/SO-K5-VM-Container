version: '3.8'
services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_presensi
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  web:
    build: .
    ports:
      - "5050:5050"
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
